# examples/ledbar.yaml
#
# AQI LED gauge consumer example.
# Composes: XIAO ESP32-C3 + Grove LED Driver + AQI Gauge package.
#
# The on_boot action activates the "AQI Gauge" effect immediately at startup.
# Per D-26: on_boot device behavior lives in the example, not the package.
#
# Consumer-owned networking: all per-user values sourced from secrets.yaml.
# See examples/secrets.yaml for dummy placeholder values used during validation.

packages:
  mcu:       github://zeroflow/wifi-airquality/packages/hardware/xiao-esp32c3.yaml@v1.0.0
  led_hw:    github://zeroflow/wifi-airquality/packages/hardware/grove-led-driver-i2c.yaml@v1.0.0
  aqi_gauge: github://zeroflow/wifi-airquality/packages/aqi/ledbar-gauge.yaml@v1.0.0

esphome:
  name: seeed-ledbar
  friendly_name: Seeed Ledbar
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: aqi_strip
          effect: "AQI Gauge"

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Seeed-Ledbar Fallback Hotspot"
    password: !secret ota_password

captive_portal:
