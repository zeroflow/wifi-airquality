# ──────────────────────────────────────────────────────────────────────────────
# Seeed XIAO ESP32-C6 - Air-Quality Sensor Station
#
# Hardware
#   MCU       Seeed XIAO ESP32-C6
#             https://wiki.seeedstudio.com/xiao_esp32c6_getting_started/
#   Base      Seeed Studio Expansion Base for XIAO
#             https://wiki.seeedstudio.com/Seeeduino-XIAO-Expansion-Board/
#             On-board: 0.96" SSD1306 OLED (I2C), PCF8563 RTC (I2C, CR1220),
#             passive buzzer (D3), user button (D1), microSD slot (SPI, CS=D2),
#             Grove connectors (2x I2C, 1x UART, 1x A0/D0)
#   Sensor 1  Sensirion SEN55 - PM1/2.5/4/10, VOC, NOx, T, RH  (I2C Grove)
#             https://wiki.seeedstudio.com/Grove-All-in-one-Environmental-Sensor-SEN55/
#   Sensor 2  Sensirion SHT41 - Temperature & Humidity            (I2C Grove)
#             https://wiki.seeedstudio.com/Grove-SHT4x/
# ──────────────────────────────────────────────────────────────────────────────

esphome:
  name: seeed-sensor
  friendly_name: seeed-sensor

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:

api:
  encryption:
    # DUMMY key - replace before flashing! Generate your own with:
    #   openssl rand -base64 32
    # (must be valid base64 of 32 bytes; this placeholder decodes to
    #  "esphome_dummy_key_replace_me_!!!")
    key: "ZXNwaG9tZV9kdW1teV9rZXlfcmVwbGFjZV9tZV8hISE="

ota:
  - platform: esphome
    # DUMMY - replace before flashing (any string).
    password: "changeme"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Seeed-Sensor Fallback Hotspot"
    # DUMMY - replace before flashing (8–63 chars).
    password: "changeme"
  use_address: 192.168.5.181

captive_portal:

# --- Buses -----------------------------------------------------------------

i2c:
  sda: D4
  scl: D5
  scan: true
  id: bus_a

spi:
  clk_pin: D8
  mosi_pin: D10
  miso_pin: D9

# --- Expansion board: User Button (D1) -------------------------------------

binary_sensor:
  - platform: gpio
    pin:
      number: D1
      mode: INPUT_PULLUP
      inverted: true
    name: "User Button"
    id: user_button
    on_press:
      - sen5x.start_fan_autoclean: sen55
      - rtttl.play:
          rtttl: "clean:d=16,o=5,b=200:c,e,g"

# --- Expansion board: Passive Buzzer (D3) -----------------------------------

output:
  - platform: ledc
    pin: D3
    id: buzzer_out

rtttl:
  output: buzzer_out
  id: buzzer

button:
  - platform: template
    name: "Buzzer Test"
    on_press:
      - rtttl.play:
          rtttl: "beep:d=4,o=5,b=200:c"

# --- Expansion board: microSD slot (SPI) ------------------------------------
# ESPHome has no built-in SD-card file component.  The SPI bus is configured
# above (CS=D2) so custom components or future support can use it directly.

# --- Display ----------------------------------------------------------------

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 14

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled
    update_interval: 1s
    lambda: |-
      it.printf(0, 0,  id(roboto), "%.1f°C", id(sht_temp).state);
      it.printf(64, 0,  id(roboto), "%.0f%%", id(sht_hum).state);
      it.printf(0, 16, id(roboto), "PM2.5:%.0f", id(sen_pm25).state);
      it.printf(64, 16, id(roboto), "10:%.0f", id(sen_pm10).state);
      it.printf(0, 32, id(roboto), "VOC:%.0f", id(sen_voc).state, id(sen_nox).state);
      it.printf(64, 32, id(roboto), "NOX:%.0f", id(sen_nox).state);
      int voc_val = clamp((int)id(sen_voc).state, 0, 500);
      int bar_w = (voc_val * 126) / 500;
      it.rectangle(0, 50, 128, 10);
      it.filled_rectangle(1, 51, bar_w, 8);

# --- RTC --------------------------------------------------------------------

time:
  - platform: pcf8563
    address: 0x51
    id: rtc_time
    update_interval: never
  - platform: sntp
    id: sntp_time
    on_time_sync:
      then:
        - pcf8563.write_time:

# --- Sensors ----------------------------------------------------------------

sensor:
  - platform: sen5x
    id: sen55
    pm_1_0:
      name: PM <1µm Weight concentration
    pm_2_5:
      name: PM <2.5µm Weight concentration
      id: sen_pm25
    pm_4_0:
      name: PM <4µm Weight concentration
    pm_10_0:
      name: PM <10µm Weight concentration
      id: sen_pm10
    temperature:
      name: "Temperature SEN55"
    humidity:
      name: "Humidity SEN55"
    voc:
      name: VOC
      id: sen_voc
    nox:
      name: NOX
      id: sen_nox

  - platform: sht4x
    temperature:
      name: "Temperature SHT41"
      id: sht_temp
    humidity:
      name: "Humidity SHT41"
      id: sht_hum
